# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# cargo-deny reads this file from the same directory as Cargo.toml.
# Run locally from repo root: cargo deny --manifest-path src-tauri/Cargo.toml check
# CI runs this on every push/PR via .github/workflows/ci.yml (audit job).

[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# `unmaintained = "workspace"` fails on unmaintained crates we own
# (i.e. in this workspace), but not on transitive dependencies of
# upstream crates. The latter cannot be fixed here — see e.g. the
# whole open-i18n/rust-unic family that Tauri ships through
# urlpattern (rustsec/advisory-db#2414). Yanked + actual security
# vulnerabilities still fail loudly via the other defaults.
unmaintained = "workspace"
yanked = "warn"
# Temporary ignores — each entry MUST carry a removal condition.
#
# RUSTSEC-2026-0194 / RUSTSEC-2026-0195: DoS in quick-xml < 0.41
# (quadratic attribute-duplicate check / unbounded xmlns allocation).
# Reached only via plist -> tauri (Apple plist parsing); Eyezen parses
# no attacker-controlled XML at runtime, so impact is negligible.
# No upgrade path exists: latest plist 1.9.0 still requires
# quick-xml ^0.39.2 (< 0.41.0).
# REMOVE when tauri's plist dependency resolves quick-xml >= 0.41.0
# (check with: cargo tree --manifest-path src-tauri/Cargo.toml -i quick-xml --target all).
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "DoS-only, unreachable input path; blocked on plist adopting quick-xml >= 0.41" },
    { id = "RUSTSEC-2026-0195", reason = "DoS-only, unreachable input path; blocked on plist adopting quick-xml >= 0.41" },
]

[licenses]
version = 2
# Eyezen is GPL-3.0-or-later. Only allow licenses compatible with GPLv3
# (Apache-2.0 with explicit patent grant is permitted by FSF). AGPL is
# excluded because it imposes stronger network copyleft than this project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
