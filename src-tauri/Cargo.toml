[package]
name = "eyezen"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"

[features]
default = ["plugin-shortcuts"]
# Wraps the global-shortcut Tauri plugin so `cargo test --no-default-features`
# can skip linking it. The crate's Windows hook destructor races with rodio
# during process exit and causes STATUS_ACCESS_VIOLATION in test binaries;
# production builds always enable the feature via the default set.
plugin-shortcuts = ["dep:tauri-plugin-global-shortcut"]

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }

[dependencies]
tauri = { version = "~2.10", features = ["tray-icon"] }
tauri-plugin-shell = "~2.3"
tauri-plugin-autostart = "~2.2"
tauri-plugin-dialog = "~2.7"
tauri-plugin-global-shortcut = { version = "~2.3", optional = true }
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tokio = { version = "~1.50", features = ["full"] }
arc-swap = "~1.7"
toml = "~0.8"
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["fmt", "env-filter"] }
tracing-appender = "~0.2"
rodio = "~0.20"
chrono = { version = "~0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "~0.10.4"
iana-time-zone = "~0.1.65"
sqlx = { version = "~0.8.6", features = ["runtime-tokio", "sqlite", "chrono"] }

[dev-dependencies]
tempfile = "~3.15"
ts-rs = "~10.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "~0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "~0.10"
core-graphics = "~0.24"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "~0.13", features = ["allow-unsafe-code", "screensaver"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
