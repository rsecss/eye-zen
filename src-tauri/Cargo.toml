[package]
name = "eyezen"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "~2.5", features = [] }

[dependencies]
tauri = { version = "~2.10", features = ["tray-icon"] }
tauri-plugin-shell = "~2.3"
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
tokio = { version = "~1.50", features = ["full"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
