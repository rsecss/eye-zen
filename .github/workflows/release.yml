name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            label: macOS (ARM)
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            label: macOS (Intel)
          - platform: ubuntu-22.04
            args: ''
            label: Linux
          - platform: windows-latest
            args: ''
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Install Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Eyezen v__VERSION__'
          releaseBody: |
            ## __VERSION__ (2026-03-21)

            First public release. A fully functional 20-20-20 eye care desktop app.

            ### 🎉 Features

            - 20-20-20 timer with configurable work/rest durations and full state machine (Working → PreAlert → Alerting → Resting)
            - Multi-monitor support — tip windows appear on all connected displays
            - Fullscreen detection — auto-skip reminders during fullscreen apps (Windows / Linux X11; macOS and Wayland limited)
            - System tray — persistent icon with status tooltip, quick actions, and glassmorphic panel
            - Settings UI — in-app settings for Timer, Behavior, and Display preferences
            - About page — version info, platform details, GitHub links
            - Dark / Light theme — CSS variable overrides + native title bar + WebView2 color-scheme
            - Auto-start — OS-level launch at startup via `tauri-plugin-autostart`
            - i18n — Chinese (zh-CN) / English (en) with hot switching
            - Sound alerts — gentle audio cue on rest reminder via rodio
            - Typed IPC — ts-rs auto-generated TypeScript bindings with typed commands and event listeners
            - Reactive stores — Svelte 5 Runes stores with race condition protection
            - Config persistence — TOML config with arc-swap hot reload

            ### ⚠️ Known Limitations

            - Fullscreen detection: macOS returns conservative `false`; Linux Wayland always shows reminders
            - No usage statistics or charts yet (planned for v0.2)
            - No away detection (planned for v0.3)
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd src-tauri/target/release
          7z a -tzip "Eyezen_${VERSION}_x64-portable.zip" eyezen.exe
          echo "PORTABLE_PATH=src-tauri/target/release/Eyezen_${VERSION}_x64-portable.zip" >> $GITHUB_ENV

      - name: Upload portable to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" "${{ env.PORTABLE_PATH }}" --clobber
