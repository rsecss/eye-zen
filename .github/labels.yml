# PR Labels for Release Notes
#
# These labels are used by .github/release.yml to auto-categorize
# pull requests into Release Notes sections.
#
# Apply via GitHub UI or `gh pr edit --add-label <label>`

# Change types (pick one)
- name: breaking-change
  color: 'd73a4a'
  description: 'Breaking change requiring user attention'

- name: enhancement
  color: 'a2eeef'
  description: 'New feature or improvement'

- name: feature
  color: '0075ca'
  description: 'New functionality'

- name: bug
  color: 'd73a4a'
  description: 'Bug fix'

- name: fix
  color: 'e4e669'
  description: 'Non-critical fix'

# Scope labels (optional, pick any)
- name: ui
  color: '7057ff'
  description: 'UI/UX related changes'

- name: theme
  color: '5319e7'
  description: 'Theme/visual changes'

- name: i18n
  color: 'bfd4f2'
  description: 'Internationalization'

- name: documentation
  color: '0075ca'
  description: 'Documentation updates'

- name: chore
  color: 'fef2c0'
  description: 'Maintenance and tooling'

- name: refactor
  color: 'd4c5f9'
  description: 'Code refactoring'

- name: dependencies
  color: '0366d6'
  description: 'Dependency updates'

- name: ci
  color: 'ededed'
  description: 'CI/CD changes'

- name: security
  color: 'b60205'
  description: 'Security related'

# Exclusion
- name: ignore-for-release
  color: 'eeeeee'
  description: 'Exclude from release notes'
