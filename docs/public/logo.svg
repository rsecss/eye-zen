<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Eyezen Logo</title>
  <desc id="desc">A clean rounded eye icon on bright green gradient background</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6BF085"/>
      <stop offset="100%" stop-color="#18B256"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <g fill="none" stroke="white" stroke-width="30" stroke-linejoin="round" stroke-linecap="round">
    <!-- Smooth elliptical eye using cubic beziers - no arc bumps -->
    <path d="M 100,256 C 130,120 382,120 412,256 C 382,392 130,392 100,256 Z"/>
    <!-- Iris ring -->
    <circle cx="256" cy="256" r="62"/>
  </g>
  <!-- Pupil -->
  <circle cx="256" cy="256" r="24" fill="white"/>
</svg>
